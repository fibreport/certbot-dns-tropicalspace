name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test]' ruff flake8
      - run: ruff format --check . && ruff check . && flake8 .
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # The plugin is not in the Snap Store: each release gets the .snap files (and the Python package) attached,
  # users install them with `snap install --dangerous`.
  snap:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.runner }}
          path: ${{ steps.build.outputs.snap }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, snap]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # stable names, so https://github.com/…/releases/latest/download/certbot-dns-tropicalspace_amd64.snap always works
      - run: |
          for f in artifacts/*.snap; do
            arch="${f##*_}"
            mv "$f" "artifacts/certbot-dns-tropicalspace_${arch}"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
