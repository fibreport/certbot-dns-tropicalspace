[bdist_wheel]
universal = 1

# PEP 8: code up to 79 characters, comments and docstrings up to 72
[flake8]
max-line-length = 79
max-doc-length = 72
exclude = .git,__pycache__,build,dist,.venv,*.egg-info

[pycodestyle]
max-line-length = 79
max-doc-length = 72
exclude = .git,__pycache__,build,dist,.venv,*.egg-info
